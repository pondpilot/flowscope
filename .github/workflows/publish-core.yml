name: Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run publish dry-run'
        required: false
        default: 'true'

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-packages:
    name: Publish crates and core npm package
    # Forks may use this workflow to test CLI release assets, but must never
    # publish packages to the public registries.
    if: ${{ github.repository == 'pondpilot/flowscope' }}
    runs-on: ubuntu-latest
    environment: prod
    env:
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: yarn install

      - name: Build WASM
        run: wasm-pack build crates/flowscope-wasm --target web --out-dir ../../packages/core/wasm

      - name: Build core package
        run: yarn workspace @pondpilot/flowscope-core build

      - name: Build react package
        run: yarn workspace @pondpilot/flowscope-react build

      - name: Resolve crate version
        id: crate_version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import re

          data = pathlib.Path('Cargo.toml').read_text()
          match = re.search(r'^version\s*=\s*"([^"]+)"', data, re.MULTILINE)
          if not match:
              raise SystemExit('Could not find workspace version in Cargo.toml')
          print(f"workspace_version={match.group(1)}")
          PY

      - name: Build embedded app assets for CLI publish
        run: |
          set -euo pipefail
          yarn --cwd app build
          rm -rf crates/flowscope-cli/embedded-app
          mkdir -p crates/flowscope-cli/embedded-app
          cp -R app/dist/. crates/flowscope-cli/embedded-app/

      - name: Verify embedded assets
        run: |
          set -euo pipefail
          test -d crates/flowscope-cli/embedded-app
          test -f crates/flowscope-cli/embedded-app/index.html
          test -d crates/flowscope-cli/embedded-app/assets
          file_count=$(find crates/flowscope-cli/embedded-app -type f | wc -l)
          if [ "$file_count" -lt 3 ]; then
            echo "Error: Too few files in embedded-app ($file_count)"
            exit 1
          fi
          echo "Embedded assets verified ($file_count files):"
          ls -la crates/flowscope-cli/embedded-app/

      - name: Dry-run publish crates
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          cargo publish -p flowscope-core --dry-run --locked --allow-dirty
          cargo publish -p flowscope-export --dry-run --locked
          cargo publish -p flowscope-cli --dry-run --locked --allow-dirty

      - name: Publish crates
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN is missing."
            exit 1
          fi
          VERSION="${{ steps.crate_version.outputs.workspace_version }}"
          for CRATE in flowscope-core flowscope-export flowscope-cli; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "User-Agent: flowscope-ci" \
              -H "Accept: application/json" \
              "https://crates.io/api/v1/crates/${CRATE}/${VERSION}")
            if [ "$STATUS" = "200" ]; then
              echo "${CRATE}@${VERSION} already published; skipping."
            elif [ "$STATUS" = "404" ]; then
              EXTRA_FLAGS=""
              if [ "$CRATE" = "flowscope-core" ] || [ "$CRATE" = "flowscope-cli" ]; then
                EXTRA_FLAGS="--allow-dirty"
              fi
              cargo publish -p "${CRATE}" --locked $EXTRA_FLAGS
            else
              echo "Unexpected crates.io status ${STATUS} for ${CRATE}@${VERSION}."
              exit 1
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Dry-run npm pack (core)
        if: ${{ env.DRY_RUN == 'true' }}
        working-directory: packages/core
        run: npm pack --dry-run --workspaces=false

      - name: Publish npm package (core)
        if: ${{ env.DRY_RUN != 'true' }}
        working-directory: packages/core
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@pondpilot/flowscope-core@${VERSION}" version >/dev/null 2>&1; then
            echo "@pondpilot/flowscope-core@${VERSION} already published; skipping."
          else
            npm publish --workspaces=false
          fi
        env:
          NODE_AUTH_TOKEN: ''

  build-cli-binaries:
    name: Build CLI (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Linux aarch64
            runs-on: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
          - name: macOS x86_64
            runs-on: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS aarch64
            runs-on: macos-15
            target: aarch64-apple-darwin
          - name: Windows x86_64
            runs-on: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Resolve CLI version
        id: cli_version
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import re

          data = pathlib.Path('Cargo.toml').read_text()
          match = re.search(r'^version\s*=\s*"([^"]+)"', data, re.MULTILINE)
          if not match:
              raise SystemExit('Could not find workspace version in Cargo.toml')
          print(f"version={match.group(1)}")
          PY

      - name: Verify release tag
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          CLI_VERSION: ${{ steps.cli_version.outputs.version }}
        run: |
          set -euo pipefail
          expected_tag="v${CLI_VERSION}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match CLI version '$CLI_VERSION'."
            exit 1
          fi

      - name: Build CLI binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: '--package flowscope-cli --locked --release'
          strip: true

      - name: Package CLI archive
        uses: houseabsolute/actions-rust-release@v1
        with:
          executable-name: flowscope
          target: ${{ matrix.platform.target }}
          archive-name: flowscope-v${{ steps.cli_version.outputs.version }}-${{ matrix.platform.target }}
          changes-file: ''
          extra-files: README.md

  publish-cli-binaries:
    name: Publish CLI binaries
    needs: build-cli-binaries
    if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run != 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download packaged CLI assets
        uses: actions/download-artifact@v4
        with:
          pattern: flowscope-v*
          path: release-assets
          merge-multiple: true

      - name: Generate aggregate SHA-256 checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(
            find release-assets -maxdepth 1 -type f \
              \( -name 'flowscope-*.tar.gz' -o -name 'flowscope-*.zip' \) \
              -printf '%f\n' | sort
          )
          if [[ "${#archives[@]}" -ne 5 ]]; then
            echo "Expected five CLI archives, found ${#archives[@]}."
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          (
            cd release-assets
            sha256sum "${archives[@]}" > "flowscope-${RELEASE_TAG}-SHA256SUMS"
          )

      - name: Upload aggregate checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowscope-${{ github.ref_name }}-SHA256SUMS
          path: release-assets/flowscope-${{ github.ref_name }}-SHA256SUMS
          if-no-files-found: error

      - name: Attest CLI release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
            release-assets/*SHA256SUMS

      - name: Publish CLI release
        uses: houseabsolute/actions-rust-release/publish@v1
        with:
          executable-name: flowscope
          artifact-regex: '\Aflowscope-v.*(\.tar\.gz|\.zip|-SHA256SUMS)\Z'
          changes-file: ''
          generate-release-notes: true
